<!-- B안: 단순 햄버거 토글 (wonjun-nav) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.getElementById('site-nav');
    if (!nav) return;

    var toggle = nav.querySelector('.wonjun-nav__toggle');
    var links  = nav.querySelector('.wonjun-nav__links');
    var dropdown = nav.querySelector('.wonjun-nav__dropdown');
    if (!toggle || !links || !dropdown) return;

    var wasMobile = window.matchMedia('(max-width: 925px)').matches;

    (function buildDropdown() {
      var items = Array.prototype.slice.call(
        links.querySelectorAll('.masthead__menu-item')
      ).filter(function (li) {
        return !li.classList.contains('masthead__menu-item--lg') &&
               !li.classList.contains('wonjun-nav__tail');
      });

      dropdown.innerHTML = '';
      items.forEach(function (li) {
        var clone = li.cloneNode(true);
        dropdown.appendChild(clone);
      });
    })();

    dropdown.addEventListener('click', function (event) {
      var link = event.target.closest('a[href*="#"]');
      if (!link) return;

      var isMobile = window.matchMedia('(max-width: 925px)').matches;
      if (!isMobile) return;

      var href = link.getAttribute('href') || '';
      var idx = href.indexOf('#');
      if (idx === -1) return;

      var id = href.slice(idx + 1).split(/[?#]/)[0];
      if (!id) return;

      var section = document.getElementById(id);
      if (!section) return;

      event.preventDefault();

      var HEADER = 80;
      var top = id === 'main'
        ? 0
        : Math.max(0, section.getBoundingClientRect().top + window.scrollY - HEADER);

      window.scrollTo({ top: top, behavior: 'smooth' });
    });

    function syncByWidth() {
      var isMobile = window.matchMedia('(max-width: 925px)').matches;

      toggle.classList.remove('hidden');
      toggle.style.visibility = 'visible';

      if (!isMobile && wasMobile) {
        dropdown.classList.remove('is-open');
        toggle.classList.remove('close');
      }
      if (isMobile) {
        toggle.style.display = 'block';

        if (dropdown.classList.contains('is-open')) {
          toggle.classList.add('close');
        } else {
          toggle.classList.remove('close');
        }
      } else {
        toggle.style.display = 'none';
        toggle.classList.remove('close');
      }

      wasMobile = isMobile;
    }

    syncByWidth();

    window.addEventListener('resize', syncByWidth);
    if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
      window.screen.orientation.addEventListener('change', syncByWidth);
    }

    toggle.addEventListener('click', function () {
      var isMobile = window.matchMedia('(max-width: 925px)').matches;
      if (!isMobile) return;

      var willOpen = !dropdown.classList.contains('is-open');
      dropdown.classList.toggle('is-open', willOpen);

      toggle.classList.toggle('close', willOpen);
    });

  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    function updatePublicationLayout() {
      var isMobile = window.matchMedia('(max-width: 925px)').matches;
      var items = document.querySelectorAll('.archive__item--with-teaser');
      if (!items.length) return;

      items.forEach(function (item) {
        item.classList.remove('archive__item--stacked');
        if (!isMobile) return;

        var teaser = item.querySelector('.archive__item-teaser--list, .archive__item-teaser');
        var body = item.querySelector('.archive__item-body');
        if (!teaser || !body) return;

        var teaserWidth = teaser.getBoundingClientRect().width;
        var bodyWidth = body.getBoundingClientRect().width;

        if (teaserWidth > bodyWidth) {
          item.classList.add('archive__item--stacked');
        }
      });
    }

    updatePublicationLayout();
    window.addEventListener('resize', updatePublicationLayout);
    if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
      window.screen.orientation.addEventListener('change', updatePublicationLayout);
    }
  });
</script>

<script>
  document.addEventListener('click', function (event) {
    var target = event.target.closest('.author__email-link');
    if (!target) return;

    var email = target.getAttribute('data-email');
    if (!email) return;

    var emailForCopy = email.replace('@', ' [at] ');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(emailForCopy).catch(function () {});
    } else {
      var textarea = document.createElement('textarea');
      textarea.value = emailForCopy;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand('copy');
      } catch (e) {
      }

      document.body.removeChild(textarea);
    }
  });
</script>
