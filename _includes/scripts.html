<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
{% include home-scrollspy.html %}
{% include analytics.html %}

<!-- B안: 단순 햄버거 토글 (wonjun-nav) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.getElementById('site-nav');
    if (!nav) return;

    var toggle = nav.querySelector('.wonjun-nav__toggle');
    var links  = nav.querySelector('.wonjun-nav__links');
    var dropdown = nav.querySelector('.wonjun-nav__dropdown');
    if (!toggle || !links || !dropdown) return;

    // 드롭다운에 들어갈 항목(Main, Publications, Talks, Teaching) 복사
    (function buildDropdown() {
      var items = Array.prototype.slice.call(
        links.querySelectorAll('.masthead__menu-item')
      ).filter(function (li) {
        return !li.classList.contains('masthead__menu-item--lg') &&
               !li.classList.contains('wonjun-nav__tail');
      });

      dropdown.innerHTML = '';
      items.forEach(function (li) {
        var clone = li.cloneNode(true);
        dropdown.appendChild(clone);
      });
    })();

    function syncByWidth() {
      var isMobile = window.matchMedia('(max-width: 925px)').matches;

      // Greedy-navigation 등이 붙인 hidden/class 영향을 제거
      toggle.classList.remove('hidden');
      toggle.style.visibility = 'visible';
      toggle.classList.remove('close');  // 항상 햄버거(≡) 상태로 초기화
      dropdown.classList.remove('is-open');

      if (isMobile) {
        // 모바일: 햄버거는 항상 보이고, 메뉴는 기본 접힌 상태
        toggle.style.display = 'block';
      } else {
        // 데스크톱: 햄버거 숨기고, 메뉴는 항상 펼쳐진 상태 (CSS가 처리)
        toggle.style.display = 'none';
      }
    }

    // 최초 한 번 동기화
    syncByWidth();

    // 창 크기/회전 변경 시 재동기화
    window.addEventListener('resize', syncByWidth);
    if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
      window.screen.orientation.addEventListener('change', syncByWidth);
    }

    toggle.addEventListener('click', function () {
      var isMobile = window.matchMedia('(max-width: 925px)').matches;
      if (!isMobile) return;

      // 메뉴 열기/닫기
      var willOpen = !dropdown.classList.contains('is-open');
      dropdown.classList.toggle('is-open', willOpen);

      // 햄버거 ↔ X 전환
      toggle.classList.toggle('close', willOpen);
    });

    // 모바일에서 드롭다운 내 항목을 클릭해도,
    // 스크롤은 home-scrollspy가 처리하고 드롭다운은 열린 상태를 유지한다.
  });
</script>

<script>
  document.addEventListener('click', function (event) {
    var target = event.target.closest('.author__email-link');
    if (!target) return;

    var email = target.getAttribute('data-email');
    if (!email) return;

    // copy with '@' replaced as shown in UI
    var emailForCopy = email.replace('@', ' [at] ');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(emailForCopy).catch(function () {});
    } else {
      var textarea = document.createElement('textarea');
      textarea.value = emailForCopy;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand('copy');
      } catch (e) {
      }

      document.body.removeChild(textarea);
    }
  });
</script>
